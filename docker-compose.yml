networks:
  network1:
    name: observe
    external: true

name: OTEL

services:

  grafana:
    container_name: grafana
    # Avoid pulling whatever Grafana publishes next; unpinned upgrades have
    # already caused frontend/runtime regressions in Explore.
    image: grafana/grafana:11.6.0

    cap_add:
      - sys_ptrace                          # Only here to help testing
      - net_admin                           # Allow NFT, used by AutoBan
      - net_raw                             # Allow NFT, used by AutoBan
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        - name: Loki
          uid: loki
          type: loki
          access: proxy 
          orgId: 1
          url: http://loki:3100
          basicAuth: false
          isDefault: true
          version: 1
          editable: false

        - name: Mimir
          uid: "mimir"
          type: prometheus
          access: proxy
          url: http://mimir:9009/prometheus
          isDefault: false
          jsonData:
            httpMethod: "POST"
            prometheusType: "Mimir"
            prometheusVersion: "2.9.1"
            tlsSkipVerify: true
            timeout: 30

        - name: Tempo
          type: tempo
          uid: tempo
          url: http://tempo:3200
          access: proxy
          basicAuth: false
        EOF
        /run.sh
    ports:
      - "3000:3000"
    networks:
      - network1

  grafana-mcp:
    container_name: grafana-mcp
    image: grafana/mcp-grafana:latest
    depends_on:
      - grafana
      - tempo
    environment:
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_USERNAME=admin
      - GRAFANA_PASSWORD=admin
    command:
      - --transport=streamable-http
      - --address=0.0.0.0:8000
      - --endpoint-path=/mcp
      - --enabled-tools=datasource,prometheus,loki,proxied
      - --disable-write
    ports:
      - "8000:8000"
    networks:
      - network1

  mimir:
    tty: true
    container_name: mimir
    build: ./mimir
    image: mimir.img
    hostname: mimir
#    ports:
#      - 0.0.0.0:9009:9009 
    #command: -config.file /etc/mimir/mimir-config.yml
    networks:
      - network1

  tempo:
    tty: true
    container_name: tempo
    build: ./tempo
    image: tempo.img
    hostname: tempo
    #privileged: true  #tempo used systemd which requires privileged access

#    command: --config.file /etc/tempo/config.yml
    networks:
      - network1
    ports:
      - "3200:3200"

  loki:
    container_name: loki
    image: grafana/loki:3.3.0
    hostname: loki
    volumes:
      - ./loki/assets/local-config.yaml:/etc/loki/local-config.yaml:ro
#    ports:
#      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - network1


  otelcol: 
   tty: true
   container_name: otelcol
   build: 
    context: ./otelcol
    dockerfile: Dockerfile
    args:
      - OTELCOL_CONFIG_PATH=./assets/dev
   image: otelcol.img
   hostname: otelcol
   depends_on:
    - loki
    - mimir
    - tempo
   networks:
    - network1
   ports:
    - "0.0.0.0:4317:4317"
    - "0.0.0.0:4318:4318"
    - "55679:55679"

   command: "/bin/otelcol-contrib --config=/etc/otelcol/config.yaml"
